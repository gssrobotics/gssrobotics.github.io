<header>
    <a href="index.html" id="title">
        <img id="logo" src="assets/graphics/robotics.svg">
        <div id="header-text">
            <span id="header-title">GSS Robotics</span>
        </div>
    </a>
    <nav>
        <a class="nav-link{% if page.url == '/' or page.url == '/index.html' %} active{% endif %}" href="index.html">
            Home
        </a>
        <a class="nav-link{% if page.url == '/about.html' %} active{% endif %}" href="about.html">
            About
        </a>
        <a class="nav-link{% if page.url contains '/robots' %} active{% endif %}" href="robots.html">
            Robots
        </a>
        <a class="nav-link{% if page.url == '/contact.html' %} active{% endif %}" href="contact.html">
            Contact
        </a>
        <a class="nav-action" href="join.html">
            <button class="button nav-action primary">
                Join Us
            </button>
        </a>
        <a class="nav-action">
            <button class="button nav-action secondary">
                Sponsor
            </button>
        </a>
    </nav>
    <div id="mobile-menu-button" onClick="toggleMobileMenu();">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 48 48">
            <rect width="48" height="12" x="0" y="0" class="fills" rx="4" ry="4" fill="currentColor" />
            <rect width="48" height="12" x="0" y="18" class="fills" rx="4" ry="4" fill="currentColor" />
            <rect width="48" height="12" x="0" y="36" class="fills" rx="4" ry="4" fill="currentColor" />
        </svg>
    </div>
</header>
